services:
  gateway:
    image: dass-api-gateway:${IMAGE_TAG:-local}

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${GATEWAY_HOST_PORT:-2399}:${GATEWAY_PORT:-2399}"

    env_file:
      - .env

    environment:
      GATEWAY_PORT: "${GATEWAY_PORT:-2399}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    mem_limit: 200m

    deploy:
      resources:
        limits:
          memory: 200M

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.GATEWAY_PORT || 2399) + '/health/live', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - dass_private

networks:
  dass_private:
    external: true
