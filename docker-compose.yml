services:
  gateway:
    image: dass-api-gateway:local
    build: .
    container_name: gateway-app
    ports:
      - "${GATEWAY_HOST_PORT:-2399}:${GATEWAY_PORT:-2399}"
    env_file:
      - .env
    environment:
      DEV_ENV: development
      GATEWAY_PORT: "${GATEWAY_PORT:-2399}"
    restart: unless-stopped
    networks:
      - dass_private

networks:
  dass_private:
    external: true
